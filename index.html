<style>
:root{
  --bg:#f4f1ea; --panel:#ffffff; --fg:#161718; --muted:#636a70; --line:#dcd8cf; --soft:#ebe7de;
  --accent:#d6451f; --accent-ink:#ffffff; --green:#1f7a4d; --amber:#c98a12; --blue:#2b5fa8; --red:#b3261e;
  --display:"Archivo","Avenir Next",Helvetica,Arial,sans-serif;
  --body:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1113; --panel:#191c1f; --fg:#eef0f2; --muted:#9aa3ab; --line:#2a2f34; --soft:#22272c;
  --accent:#ff6a3d; --accent-ink:#1a0b05; --green:#4fc38a; --amber:#e7b046; --blue:#6f9ae8; --red:#f28b82; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1113; --panel:#191c1f; --fg:#eef0f2; --muted:#9aa3ab; --line:#2a2f34; --soft:#22272c;
  --accent:#ff6a3d; --accent-ink:#1a0b05; --green:#4fc38a; --amber:#e7b046; --blue:#6f9ae8; --red:#f28b82; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;display:flex;flex-direction:column;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{flex:1;padding:14px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));max-width:560px;width:100%;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2.1rem;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
h2{font-size:1.25rem;font-weight:700;margin:26px 0 10px}
h3{font-size:1rem;font-weight:700}
p{margin:0 0 10px;max-width:62ch}
ul{margin:0 0 12px;padding-left:20px}li{margin-bottom:4px}
.muted{color:var(--muted)}
.sm{font-size:.85rem}.xs{font-size:.78rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600;font-family:var(--display)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card.hero{border:0;background:var(--fg);color:var(--bg)}
.card.hero .eyebrow,.card.hero .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-family:var(--display);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor;opacity:.85}
.btn.small{padding:7px 12px;font-size:.85rem}
.btn:focus-visible,.check:focus-visible,.tabbar button:focus-visible,input:focus-visible,select:focus-visible,.seg button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0;flex:1}
.row.tight>*{flex:0 0 auto}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:11px 14px;color:inherit;margin-top:8px}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.check[aria-checked="true"]{background:color-mix(in srgb,var(--green) 16%,var(--panel));border-color:var(--green)}
.check[aria-checked="true"] .box{background:var(--green);border-color:var(--green)}
.check .box svg{width:14px;height:14px}
.check .pts{margin-left:auto;font-family:var(--display);font-weight:900;font-size:.85rem;color:var(--muted);flex:none}
.check[aria-checked="true"] .pts{color:var(--green)}
.hero .check{background:color-mix(in srgb,var(--bg) 14%,transparent);color:inherit}
.hero .check .box{border-color:color-mix(in srgb,var(--bg) 60%,transparent)}
.hero .check[aria-checked="true"]{background:color-mix(in srgb,var(--green) 35%,transparent);border-color:var(--green)}
.hero .check .pts{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.hero .check[aria-checked="true"] .pts{color:#fff}
.minrow{display:flex;gap:6px;margin:6px 0 0 36px;flex-wrap:wrap}
.minrow button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:.75rem;font-family:var(--display);font-weight:700}
.minrow button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hero .minrow button{border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:inherit}
.hero .minrow button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-top:8px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:.8rem;font-weight:600;color:var(--muted);font-family:var(--display)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.q[aria-pressed="true"]{color:var(--green)}
.seg button.n[aria-pressed="true"]{color:var(--amber)}
.meal{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.meal b{font-family:var(--display)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{background:var(--soft);border:1px solid transparent;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;font-family:var(--display);color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.chips button i{font-style:normal;background:var(--fg);color:var(--bg);border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:.72rem;font-weight:900}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.week .d{background:var(--soft);border-radius:10px;padding:8px 2px;text-align:center;font-size:.7rem;line-height:1.3;border:1px solid transparent}
.week .d b{display:block;font-family:var(--display);font-size:.8rem}
.week .d.today{border-color:var(--accent)}
.week .d.done{background:color-mix(in srgb,var(--green) 18%,var(--panel))}
.week .d .dot{display:block;width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.week .d.done .dot{background:var(--green)}
.week .d.intense .dot{background:var(--accent)}
.week .d.done.intense .dot{background:var(--green)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);font-family:var(--display)}
.pill.hot{background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--green) 18%,var(--panel));color:var(--green)}
.pill.warn{background:color-mix(in srgb,var(--amber) 22%,var(--panel));color:var(--amber)}
.pill.bad{background:color-mix(in srgb,var(--red) 18%,var(--panel));color:var(--red)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat.two{grid-template-columns:repeat(2,1fr)}
.stat>div{background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-weight:900}
.stat span{font-size:.7rem;color:var(--muted)}
.hero .stat>div{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.hero .stat span{color:color-mix(in srgb,var(--bg) 70%,transparent)}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.del{background:none;border:0;color:var(--muted);font-size:1rem;padding:0 4px}
.meter{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabbar button{background:none;border:0;padding:9px 2px 7px;color:var(--muted);font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:var(--display);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:.85rem;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:var(--panel)}
summary{cursor:pointer;font-family:var(--display);font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::after{content:"+";color:var(--muted);font-size:1.2rem}
details[open] summary::after{content:"–"}
details>div{padding-top:8px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:10px 0}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.chart .base{stroke:var(--line);stroke-dasharray:3 3}
.chart .l{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .p{stroke-width:0}
.delta{font-family:var(--display);font-weight:900}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.flat{color:var(--muted)}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.onb{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.onb h1{font-size:2.6rem}
.opts{font-size:.85rem;margin-top:10px}
.opts b{display:block;font-family:var(--display);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:8px 0 2px}
.opts a{color:inherit}
.sharecard{display:none}
.week .d{cursor:pointer}.week .d.sel{background:var(--fg);color:var(--bg)}.week .d.sel .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.navrow button{background:var(--soft);border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-family:var(--display)}
.counter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px}
.counter>div{background:var(--soft);border-radius:10px;padding:6px 2px;text-align:center;min-width:0}
.counter .lab{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-weight:700}
.counter .ctl{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:2px}
.counter .ctl button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-weight:900;font-size:1rem;line-height:1;padding:0}
.counter .ctl b{font-family:var(--display);min-width:14px;font-size:1rem}
.counter>div.on{background:color-mix(in srgb,var(--green) 16%,var(--panel))}
.gear{background:var(--soft);border:0;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:var(--fg);flex:0 0 auto}
.gear svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plan{white-space:pre-wrap;font-size:.9rem;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:8px}
.hero .plan{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.goalbar{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:.85rem}
</style>
</head>

/* Points for one day */
function dayPoints(k){
  let p=0; const day=dayDef(k);
  for(const s of day.sessions) if(sessOf(k,s.id).done) p+=s.pts;
  const m=S.meals[k]||{}; for(const [id] of MEALS) if(mealQuality(m[id])) p+=PTS.meal;
  const sp=S.supps[k]||{}; for(const s of SUPPS) if(sp[s.k]) p+=s.pts;
  p+=S.heat.filter(x=>x.d===k).length*PTS.heat + S.cold.filter(x=>x.d===k).length*PTS.cold;
  p+=S.medit.filter(x=>x.d===k).length*PTS.medit + S.roll.filter(x=>x.d===k).length*PTS.roll + S.light.filter(x=>x.d===k).length*PTS.light;
  const sl=sleepHours(k); if(sl!=null&&sl>=SLEEP_GOAL) p+=PTS.sleep;

function weekNutrition(d=today()){ let q=0,n=0,r=0,prot=[],prod=[]; for(const k of weekKeys(d)){ const x=dayNutrition(k); q+=x.q; n+=x.n; r+=x.r; if(x.q+x.n){ prot.push(x.protein); prod.push(x.produce) } } const units=q+n+r/REWARD_PER_UNIT; return {q,n,r,units,pct:units?Math.round(q/units*100):null,protein:avg(prot),produce:avg(prod)} }

/* VO2max estimates */
function vo2FromTest(t,kg){
  if(!kg) return null;
  if(t.mod==="bike"){ const pmax=t.v/0.75; return 10.8*pmax/kg+7 }
  if(t.mod==="row"){ const sec=t.v; if(!sec) return null; const pace=sec/2000; const w=2.8/Math.pow(pace,3); return 10.8*w/kg+7 }
  if(t.mod==="run"){ const sec=t.v; if(!sec) return null; const tmin=sec/60, v=1609.34/tmin; const vo2=-4.6+0.182258*v+0.000104*v*v; const pct=0.8+0.1894393*Math.exp(-0.012778*tmin)+0.2989558*Math.exp(-0.1932605*tmin); return vo2/pct }
  return null;
}

function chart(points,{color="var(--accent)",fmtV=v=>v,baseline=null,height=90}={}){
  const pts=points.filter(p=>p.v!=null&&!isNaN(p.v));
  if(pts.length<2) return `<p class="muted xs">Needs two or more entries to chart.</p>`;
  const W=320,H=height,pl=34,pr=8,pt=10,pb=18;
  const xs=pts.map(p=>parseD(p.d).getTime()); const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1;
  let vs=pts.map(p=>p.v); if(baseline!=null) vs=vs.concat(baseline);
  let lo=Math.min(...vs),hi=Math.max(...vs); if(hi-lo<1e-6){lo-=1;hi+=1} const pad=(hi-lo)*.15; lo-=pad; hi+=pad;
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr), Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const path=pts.map((p,i)=>(i?"L":"M")+X(parseD(p.d).getTime()).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle class="p" cx="${X(parseD(p.d).getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="${color}"/>`).join("");
  const base=baseline!=null?`<line class="base" x1="${pl}" x2="${W-pr}" y1="${Y(baseline).toFixed(1)}" y2="${Y(baseline).toFixed(1)}"/>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${base}<path class="l" d="${path}" stroke="${color}"/>${dots}
  <text x="2" y="${pt+4}">${fmtV(hi-pad)}</text><text x="2" y="${H-pb}">${fmtV(lo+pad)}</text>
  <text x="${pl}" y="${H-4}">${fmt(pts[0].d)}</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${fmt(pts[pts.length-1].d)}</text></svg>`;
}

function vWhy(){
  return `<div class="onb"><div class="eyebrow">Get Ripped</div><h1>Why we do this</h1>
  <p class="muted">A year-long program built by a sports medicine doc who wants to train hard and stay healthy, for anyone who wants the same. Everything in it is literature-based and cheap. Nothing in it needs a syringe, a subscription or an influencer.</p>

  <p style="opacity:.9">You control five inputs. The app scores them every week. Every two months you measure the outputs: fitness, muscle, body fat. Keep the input line high and the output lines follow. That's the whole program.</p></div>
  <h2>The five habits</h2>
  <div class="card">
   <p><b>1. Move 45 minutes a day.</b> Two strength days, two easy days, two hard days, one yoga day. Ten minutes of mobility every single day, because that's the part everyone skips and the part that keeps you lifting at 60.</p>
   <p><b>When:</b> mornings work best, before the day gets a vote. But a session at 6 pm counts exactly the same as one at 6 am. Done beats early.</p>
   <p><b>2. Protein and produce.</b> A palm of protein at every meal and five fists of fruit and veg a day. Hit that and the rest of your plate is your business.</p>
   <p><b>3. Sleep.</b> Seven-plus hours, same wake time, morning light. Every other habit works better on sleep.</p>
   <p><b>4. Heat and cold.</b> Three saunas and eleven minutes of cold a week. Optional, but the mortality data is hard to ignore.</p>
   <p><b>5. Weigh in on Friday.</b> Once. Same scale, same conditions. The trend is the signal; one bad morning is noise.</p>
  </div>
  <h2>The rules</h2>
  <div class="card">
   <p><b>Majority rules.</b> 80/20. Eat right most of the time and the beer and dessert are earned. We don't count calories; we count whether the right things got done.</p>
   <p><b>Muscle up, fat down beats pounds down.</b> Same weight with better composition is a win and the app shows it as one.</p>
   <p><b>Cheap and proven.</b> Creatine, collagen, fish oil, a recovery drink. Vitamin D if a lab says so. No peptides, no GLP-1s unless a doctor prescribes them, no proprietary blends.</p>
   <p><b>Fifteen seconds a day.</b> Tap what you did. If logging takes longer than that, we built it wrong.</p>
  </div>
  <h2>What to expect</h2>

  <details><summary>Omega-3 fish oil</summary><div><p>Anti-inflammatory, supports recovery and cardiovascular health when EPA+DHA is dosed properly: 2–3 g combined daily with a meal. Read the label; that's often 3–4 capsules of a cheap bottle. Two servings of fatty fish a week does the same job.</p></div></details>
  <details><summary>Vitamin D</summary><div><p>Only worth taking if you're low, which is common in Rochester from October to April. It doesn't help if your level is normal. Ask primary care for a level, then dose to it.</p></div></details>
  <details><summary>Electrolytes and magnesium</summary><div><p>Sodium and potassium are what you sweat out in a bootcamp; the drink covers it. Magnesium glycinate 200–400 mg: weak-to-moderate evidence for sleep and cramps, very safe, easy on the stomach.</p></div></details>
  <h2>Use with a plan</h2>
  <details><summary>Caffeine</summary><div><p><b>Helps:</b> 1–3 mg per kg (roughly 100–250 mg, one to two coffees) 30–60 minutes before a hard session improves power, endurance and perceived effort. It's one of the few supplements with decades of evidence.</p><p><b>Hurts:</b> anything within 8–10 hours of bed cuts deep sleep even if you fall asleep fine. More than ~400 mg a day raises anxiety and resting heart rate. Daily use builds tolerance, so the pre-workout boost fades unless you keep most days modest.</p><p><b>How to use it:</b> wait 60–90 minutes after waking for the first cup; coffee or plain caffeine, not pre-workout blends; last caffeine by early afternoon; keep two or three days a week low so hard days still feel the kick.</p></div></details>
  <details><summary>Nicotine</summary><div><p><b>What's real:</b> at very low doses (1–2 mg, gum or pouch) nicotine modestly improves attention and reaction time in some studies, which is why it's had a moment in productivity circles.</p><p><b>Why we don't bother:</b> the doses that help are smaller than most products sell, the window between "a little sharper" and "dependent" is narrow, it raises blood pressure and heart rate, and the upside is the same you'd get from caffeine, sleep and a walk outside. Addiction risk for a small cognitive bump isn't a trade worth making. If you're already using it, this is the place to taper, not add.</p></div></details>
  <h2>Not on the list, on purpose</h2>
  <details><summary>CBD</summary><div><p>No good evidence for pain, recovery or sleep at the doses in gummies and oils. Products vary widely in what they actually contain, and some include THC.</p></div></details>
  <details><summary>Peptides (BPC-157, TB-500 and friends)</summary><div><p>Animal data and anecdotes, no controlled human trials, no quality control on what's in the vial, and banned in tested sport. Not something to buy off the internet.</p></div></details>
  <details><summary>GLP-1s (semaglutide, tirzepatide)</summary><div><p>Real drugs with real evidence, for people who medically need them. They cost muscle as well as fat unless protein and strength training are dialed in, which is this whole program. Use only if medically indicated and prescribed, never from a compounding website.</p></div></details>
  <details><summary>Testosterone, pre-workouts, fat burners, "joint blends"</summary><div><p>Testosterone is a medical decision based on symptoms and labs, not a supplement. The rest are caffeine and marketing. Proprietary blends hide the doses so you can't tell what you're taking.</p></div></details>
  <div class="note">Rule of thumb: if it's cheap, single-ingredient, and has been studied for decades, it's on the list. If it needs a syringe, a subscription, or an influencer, it isn't.</div>`;
}

function parseMeal(text){
  const t=" "+text.toLowerCase().replace(/[.,;!]/g," ")+" ";
  const out={b:{},l:{},d:{},s:{}}, rewards={}, notes=[];
  // Clauses: "X for lunch" assigns X to lunch; "lunch: X" / "lunch was X" assigns what follows to lunch.
  const segs=[]; const MK={breakfast:"b",lunch:"l",dinner:"d",supper:"d",snack:"s"};
  const re=/\b(for\s+|at\s+)?(breakfast|lunch|dinner|supper|snack)\b/g; let cursor=0, cur="s", mm;
  while((mm=re.exec(t))){ const before=t.slice(cursor,mm.index); const meal=MK[mm[2]];
    if(mm[1]){ if(before.trim()) segs.push([meal,before]); cur=meal; }
    else { if(before.trim()) segs.push([cur,before]); cur=meal; }
    cursor=mm.index+mm[0].length; }
  const rest=t.slice(cursor); if(rest.trim()) segs.push([cur,rest]);
  function count(seg,word){ const esc=word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); const r=new RegExp("(?:(\\d+|"+Object.keys(NUMW).join("|")+")\\s+)?"+esc+"\\b","g"); let n=0, mm; while((mm=r.exec(seg))){ n+=mm[1]?(NUMW[mm[1]]||parseFloat(mm[1])):1 } return n }
  for(const [meal,seg] of segs){
    for(const cat of ["p","f","v","c"]){ let n=0; for(const w of WORDS[cat]) n+=count(seg,w); if(n){ out[meal][cat]=(out[meal][cat]||0)+Math.min(3,Math.ceil(n)); } }
    for(const cat of ["alc","dessert","snack"]){ let n=0; for(const w of WORDS[cat]) n+=count(seg,w); if(n) rewards[cat]=(rewards[cat]||0)+Math.ceil(n) }
  }
  const drink=/recovery drink|post.?workout (drink|shake)|protein shake/.test(t);
  let smoothie=null; for(const [meal,seg] of segs){ if(/smoothie/.test(seg)){ smoothie=meal==="s"&&!/snack/.test(seg)?"b":meal } }
  return {meals:out,rewards,smoothie,drink};
}
function applyParsed(k,res){ S.meals[k]=S.meals[k]||{}; S.rewards[k]=S.rewards[k]||{}; const touched=[];
  if(res.drink){ S.supps[k]=S.supps[k]||{}; S.supps[k].drink=true; for(const x of IN_DRINK) S.supps[k][x]=true; touched.push("Recovery drink (+"+DRINK_PROTEIN+" g)") }
  if(res.smoothie){ const id=res.smoothie; const m=S.meals[k][id]||{p:0,f:0,v:0,c:0}; delete m.q; delete m.n; m.p+=2; m.f+=1; m.v+=1; m.c+=1; S.meals[k][id]=m; touched.push("Smoothie → "+MEALS.find(x=>x[0]===id)[1]+" P2 F1 V1 C1") }
  for(const [id,name] of MEALS){ const r=res.meals[id]; if(!r||!Object.keys(r).length) continue; const m=S.meals[k][id]||{p:0,f:0,v:0,c:0}; delete m.q; delete m.n; for(const c in r) m[c]=(m[c]||0)+r[c]; S.meals[k][id]=m; touched.push(name+" "+Object.entries(r).map(([c,n])=>c.toUpperCase()+n).join(" ")) }
  for(const [id,name] of REWARDS){ if(res.rewards[id]){ S.rewards[k][id]=(S.rewards[k][id]||0)+res.rewards[id]; touched.push(name+" ×"+res.rewards[id]) } }
  return touched; }
let recog=null;
function startSpeech(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const input=$("#fSay [name=text]"); if(!SR){ toast("No mic here: tap the keyboard mic instead"); input.focus(); return }
  try{ recog=new SR(); recog.lang="en-US"; recog.interimResults=false; recog.onresult=e=>{ input.value=(input.value?input.value+" ":"")+e.results[0][0].transcript; $("#sayOut").textContent="Heard: "+e.results[0][0].transcript+" — tap Add to today."; }; recog.onerror=()=>toast("Mic didn't work: use the keyboard mic"); recog.start(); $("#sayOut").textContent="Listening…"; }catch(e){ toast("Mic didn't work: use the keyboard mic"); input.focus() } }

/* =========================== SHARE CARD =========================== */
function drawShareCard(){
  const c=$("#shareCanvas"), x=c.getContext("2d"), W=c.width, H=c.height;
  const p=S.profile||{}, wp=weekPoints(), wk=weekKeys(), sessions=wk.filter(k=>sessOf(k,"main").done).length, mobs=wk.filter(k=>sessOf(k,"mob").done).length, wn=weekNutrition();
  const rw=rolling("wt"), rf=rolling("bf"), rm=rolling("mm"); const prev={wt:rolling("wt",4,4),bf:rolling("bf",4,4),mm:rolling("mm",4,4)};
  x.fillStyle="#161718"; x.fillRect(0,0,W,H); x.fillStyle="#d6451f"; x.fillRect(0,0,W,22);
  x.fillStyle="#9aa3ab"; x.font="600 34px Archivo, Helvetica, Arial"; x.fillText("GET RIPPED · WEEK OF "+fmt(wk[0]).toUpperCase(),80,120);
  x.fillStyle="#f4f1ea"; x.font="900 120px Archivo, Helvetica, Arial"; x.fillText(String(wp),80,260); const nw=x.measureText(String(wp)).width; x.font="700 44px Archivo, Helvetica, Arial"; x.fillText("points",80+nw+24,260);
  x.font="600 40px Inter, Helvetica, Arial";
  const rows=[["Sessions",sessions+" / 7"],["Mobility days",mobs+" / 7"],["Training minutes",wk.reduce((a,k)=>a+dayMinutes(k),0)+""],["Quality eating",wn.pct==null?"–":wn.pct+"%"],["Sauna · cold",weekMinutes(S.heat)+" · "+weekMinutes(S.cold)+" min"],["Sleep avg",weekSleep()!=null?weekSleep().toFixed(1)+" h":"–"]];
  rows.forEach((r,i)=>{ const y=360+i*74; x.fillStyle="#9aa3ab"; x.fillText(r[0],80,y); x.fillStyle="#f4f1ea"; x.textAlign="right"; x.fillText(r[1],W-80,y); x.textAlign="left" });
  x.strokeStyle="#2a2f34"; x.lineWidth=3; x.beginPath(); x.moveTo(80,790); x.lineTo(W-80,790); x.stroke();
  x.fillStyle="#9aa3ab"; x.font="600 34px Archivo, Helvetica, Arial"; x.fillText("4-WEEK TREND",80,860);
  const tr=[["Weight",rw,prev.wt," lb",p.goal==="muscle"],["Body fat",rf,prev.bf,"%",false],["Muscle",rm,prev.mm," lb",true]];
  tr.forEach((t,i)=>{ const y=950+i*90; x.fillStyle="#9aa3ab"; x.font="600 40px Inter, Helvetica, Arial"; x.fillText(t[0],80,y);
    let txt="–", col="#f4f1ea"; if(t[1]!=null){ txt=t[1].toFixed(1)+t[3]; if(t[2]!=null){ const d=t[1]-t[2]; const arrow=Math.abs(d)<.05?"→":(d>0?"↑":"↓"); txt+="  "+arrow+" "+(d>0?"+":"")+d.toFixed(1); col=Math.abs(d)<.05?"#f4f1ea":((d>0)===t[4]?"#4fc38a":"#f28b82") } }
    x.fillStyle=col; x.textAlign="right"; x.fillText(txt,W-80,y); x.textAlign="left" });
  x.fillStyle="#636a70"; x.font="600 30px Archivo, Helvetica, Arial"; x.fillText((p.name?p.name.toUpperCase()+" · ":"")+"INPUTS IN, OUTPUTS OUT",80,H-70);
  return c;
}
async function shareCard(){ try{ await document.fonts.ready }catch(e){} const c=drawShareCard();
  c.toBlob(async blob=>{ const file=new File([blob],"get-ripped-week.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:"Get Ripped week"}) }catch(e){} }
    else{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="get-ripped-week.png"; a.click(); toast("Card saved") } },"image/png"); }
function exportData(){ const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="get-ripped-"+ymd(today())+".json"; a.click(); toast("Exported") }
function shrinkImage(file){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,480/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=img.width*s; c.height=img.height*s; c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.7)) }; img.onerror=()=>res(null); img.src=URL.createObjectURL(file) }) }

/* =========================== RENDER + EVENTS =========================== */
let lastTab=null;
function render(){
  const keep=lastTab===tab?window.scrollY:0; lastTab=tab;
  if(tab==="why"||(!S.profile&&!S.seenWhy)){ $("#main").innerHTML=vWhy(); $("#tabbar").hidden=true; window.scrollTo(0,0); return }
  if(!S.profile||tab==="onboard"){ $("#main").innerHTML=vOnboard(); $("#tabbar").hidden=true; window.scrollTo(0,0); return }
  $("#tabbar").hidden=false;
  $("#main").innerHTML=TABS.find(t=>t.id===tab).view();
  $("#tabbar").innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t.id===tab}" data-tab="${t.id}">${t.icon}${t.label}</button>`).join("");
  window.scrollTo(0,keep);
}
function shiftDate(k,n){ const d=parseD(k); d.setDate(d.getDate()+n); return ymd(d) }
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-go],[data-sess],[data-min-set],[data-sel],[data-week],[data-nut],[data-food],[data-mealset],[data-reward],[data-say],[data-supp],[data-vitd],[data-plan-reset],[data-log],[data-del],#wipe,#share,#export"); if(!t) return;
  const ds=t.dataset;
  if(ds.tab||ds.go){ lastTab=null; tab=ds.tab||ds.go; if(tab==="onboard"&&!S.profile){ S.seenWhy=true; save() } if(tab!=="onboard"&&tab!=="why") location.hash=tab; if(tab==="workout") sel=ymd(today()); render(); return }
  if(ds.sess){ const k=ds.k; if(k>ymd(today())) return; S.sess[k]=S.sess[k]||{}; const s=S.sess[k][ds.sess]||{}; s.done=!s.done; if(s.done&&!s.min){ const def=dayDef(k).sessions.find(x=>x.id===ds.sess); s.min=def.range[1] } S.sess[k][ds.sess]=s; save(); render(); if(s.done) toast("+"+dayDef(k).sessions.find(x=>x.id===ds.sess).pts+" · "+dayMinutes(k)+" min today"); return }
  if(ds.minSet){ const k=ds.k; S.sess[k]=S.sess[k]||{}; S.sess[k][ds.minSet]=S.sess[k][ds.minSet]||{done:true}; S.sess[k][ds.minSet].min=+ds.v; save(); render(); return }
  if(ds.sel){ sel=ds.sel; lastTab=null; render(); return }
  if(ds.week){ sel=shiftDate(sel,7*+ds.week); lastTab=null; render(); return }
  if(ds.nut){ const n=shiftDate(nutDay,+ds.nut); if(n<=ymd(today())) nutDay=n; render(); return }
  if(ds.mealset!==undefined){ const k=nutDay; S.meals[k]=S.meals[k]||{}; const v=ds.v; if(v==="q") S.meals[k][ds.mealset]=(mealQuality(S.meals[k][ds.mealset])?S.meals[k][ds.mealset]:{p:1,f:0,v:1,c:0,q:1}); else if(v==="n") S.meals[k][ds.mealset]={p:0,f:0,v:0,c:0,n:1}; else delete S.meals[k][ds.mealset]; save(); render(); return }
  if(ds.food){ const k=nutDay; S.meals[k]=S.meals[k]||{}; const m=S.meals[k][ds.meal]||{p:0,f:0,v:0,c:0}; m[ds.food]=Math.max(0,(m[ds.food]||0)+ +ds.dv); delete m.q; delete m.n; S.meals[k][ds.meal]=m; save(); render(); return }
  if(ds.reward){ const k=nutDay; S.rewards[k]=S.rewards[k]||{}; S.rewards[k][ds.reward]=Math.max(0,(S.rewards[k][ds.reward]||0)+ +ds.dv); save(); render(); return }
  if(ds.supp){ const k=ds.k; S.supps[k]=S.supps[k]||{}; const on=!S.supps[k][ds.supp]; S.supps[k][ds.supp]=on; if(ds.supp==="drink"){ for(const x of IN_DRINK) S.supps[k][x]=on } save(); render(); if(ds.supp==="drink"&&on) toast("Drink logged: +"+DRINK_PROTEIN+" g protein, creatine and collagen ticked"); return }
  if(ds.vitd){ S.profile.vitd=!S.profile.vitd; save(); render(); return }
  if(ds.planReset){ const f=$("#fPlan"); const mk=f.dataset.mk, day=f.dataset.day; if(S.plans[mk]) delete S.plans[mk][day]; save(); render(); toast("Back to the default plan"); return }
  if(ds.log){ S[ds.log].push({id:Date.now(),d:ymd(today()),min:+ds.min}); save(); render(); toast("+"+ds.min+" min · +"+PTS[ds.log]+" pt"+(PTS[ds.log]>1?"s":"")); return }
  if(ds.del){ S[ds.del]=S[ds.del].filter(x=>String(x.id)!==ds.id); save(); render(); return }
  if(ds.say){ startSpeech(); return }
  if(t.id==="share"){ shareCard(); return }
  if(t.id==="export"){ exportData(); return }
  if(t.id==="wipe"&&confirm("Erase everything on this phone?")){ S=structuredClone(DEFAULT); save(); render() }
});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f), d=Object.fromEntries(fd);
  if(f.id==="fOnboard"){ const prev=S.profile||{}; S.profile={...prev,name:d.name.trim(),age:+d.age,sex:d.sex,heightIn:(+d.ft)*12+(+d.inch),weightLb:d.weightLb,bf:d.bf,mm:d.mm,modality:d.modality,goal:d.goal,why:d.why.trim(),start:prev.start||ymd(today())};
    if(!S.weigh.length) S.weigh.push({id:Date.now(),d:S.profile.start,wt:d.weightLb,bf:d.bf,mm:d.mm});
    tab="workout"; location.hash=tab; save(); render(); toast(prev.name?"Profile saved":"Baseline set. Let's go."); return }
  if(f.id==="fWeigh"){ let photo=null; const file=fd.get("photo"); if(file&&file.size) photo=await shrinkImage(file); S.weigh=S.weigh.filter(x=>x.d!==d.d); S.weigh.push({id:Date.now(),d:d.d,wt:d.wt,bf:d.bf,mm:d.mm,photo}); toast("Weigh-in logged") }
  if(f.id==="fTest"){ let v=d.mod==="bike"?+d.v:parseTime(d.v); if(v==null||isNaN(v)){ toast("Check the result format"); return } S.tests.push({id:Date.now(),d:d.d,mod:d.mod,v,watch:d.watch,note:d.note}); toast("Test logged") }
  if(f.id==="fPlan"){ const mk=f.dataset.mk, day=f.dataset.day; S.plans[mk]=S.plans[mk]||{}; S.plans[mk][day]={text:d.text.trim(),link:d.link.trim()}; toast("Plan saved for the month") }
  if(f.id==="fSay"){ const txt=d.text.trim(); if(!txt) return; const res=parseMeal(txt); const touched=applyParsed(nutDay,res); save(); render(); const out=$("#sayOut"); if(out) out.textContent=touched.length?"Added: "+touched.join(" · ")+". Fix any counts above.":"Didn't recognize any food words in that. Try naming the foods: eggs, chicken, salad, rice, a beer."; return }
  if(f.id==="fExtra"){ S.extras.push({id:Date.now(),d:d.d,kind:d.kind,v:d.v.trim(),note:d.note.trim()}); toast("Logged") }
  if(f.id==="fSleep"){ S.sleep[ymd(today())]={bed:d.bed,wake:d.wake}; const h=sleepHours(ymd(today())); toast(h!=null?h+" h logged"+(h>=SLEEP_GOAL?" · +"+PTS.sleep:""):"Sleep saved") }
  if(f.id==="fSmoothie"){ S.smoothie=d.smoothie.trim()||DEFAULT_SMOOTHIE; toast("Recipe saved") }
  if(f.id==="fDrink"){ S.drink=d.drink.trim()||DEFAULT_DRINK; toast("Recipe saved") }
  if(f.classList.contains("fSrc")){ S.src=S.src||{}; S.src[f.dataset.k]=d.src.trim(); S.buy=S.buy||{}; S.buy[f.dataset.k]=d.buy.trim(); toast("Saved") }
  save(); render();
});
window.addEventListener("hashchange",()=>{ const h=location.hash.replace("#",""); if(TABS.find(t=>t.id===h)&&h!==tab){ tab=h; render() } });
render();
})();
